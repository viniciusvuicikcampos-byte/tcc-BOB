<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neymar Rei - Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>

    <!-- Neymar (lado esquerdo) -->
    <img
        src="imagem/Neymar-PNG-Santos-Football-Render-scaled.png"
        alt="Neymar"
        class="neymar"
        width="300"
    >

    <!-- Formulário de cadastro -->
    <form id="bat-form" class="bat-container">

        <label for="nome">Nome do jogador:</label>
        <input
            type="text"
            id="nome"
            name="nome"
            placeholder="Ex: Neymar Jr"
            required
        >

        <label for="email">Ney-Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Ex: Neymar@Santos.com"
            required
        >

        <label for="senha">Ney-senha:</label>
        <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Ex: 123456..."
            minlength="6"
            required
        >

        <button type="submit" id="btn-entrar">
            Entrar na Vila Belmiro
        </button>

    </form>

    <!-- Escudo do Santos (lado direito) -->
    <img
        src="imagem/images.png"
        alt="Escudo do Santos"
        class="escudo"
        width="300"
    >

    <script src="app.js"></script>

</body>
</html>
