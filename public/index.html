<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat com Neymar</title>

    <link rel="stylesheet" href="index.css">
</head>
<body>

    <main class="pagina">

        <!-- NEYMAR -->
        <section class="neymar">
            <img
                src="imagem/Neymar-PNG-Santos-Football-Render-scaled.png"
                alt="Neymar"
            >

            <h1>Neymar Jr.</h1>
            <p>Converse comigo pelo chat ⚽</p>
        </section>

        <!-- CHAT -->
        <section class="chat">

            <header class="cabecalho">
                <h2>💬 Chat com Neymar</h2>
                <p>● Neymar está online</p>
            </header>

            <!-- MENSAGENS -->
            <div id="chatMensagens" class="mensagens">

                <div class="mensagem mensagem-neymar">
                    <span>Neymar</span>
                    <p>
                        Fala! 👋⚽
                        Pode conversar comigo. Digite uma mensagem aqui embaixo!
                    </p>
                </div>

            </div>

            <!-- CAMPO PARA ESCREVER -->
            <div class="campo-chat">

                <input
                    id="campoMensagem"
                    type="text"
                    placeholder="Digite sua mensagem..."
                    autocomplete="off"
                >

                <button
                    id="botaoEnviar"
                    type="button"
                >
                    Enviar
                </button>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
